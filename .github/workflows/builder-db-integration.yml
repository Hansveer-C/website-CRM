name: Builder DB Integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder-homepage-quality-gate:
    name: Builder Homepage Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Focused Lifecycle Tests
        run: npx vitest run src/builder_page_lifecycle.test.ts src/builder_duplicate_page_controller.test.ts src/builder_delete_page_controller.test.ts src/builder_reorder_pages_controller.test.ts src/builder_set_homepage_controller.test.ts src/builder_homepage_browser.test.ts src/builder_route_lifecycle.test.ts src/builder_route_repository.test.ts src/pages_repo_supabase.test.ts

      - name: Run Phase 0 Tests
        run: npm run test:phase0

      - name: Run Safe Broad Suite
        run: npx vitest run --exclude "**/verify_sms_backend.test.ts"

      - name: Typecheck App
        run: npm run typecheck:app

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Build
        run: npm run build

      - name: Check PR Diff Whitespace
        run: git diff --check origin/main...HEAD

  standalone-delete-db-integration:
    name: Standalone Delete DB Integration (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Standalone Delete DB Tests
        run: |
          PAGE_DELETE_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" npx vitest run supabase/tests/delete_builder_page.test.ts

  standalone-reorder-db-integration:
    name: Standalone Reorder DB Integration (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Standalone Reorder DB Tests
        run: |
          PAGE_REORDER_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" npx vitest run --no-file-parallelism supabase/tests/reorder_builder_pages.test.ts supabase/tests/reorder_builder_pages_validation.test.ts

  standalone-homepage-db-integration:
    name: Standalone Homepage DB Integration (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Standalone Homepage DB Tests
        run: |
          BUILDER_HOMEPAGE_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" npx vitest run supabase/tests/set_builder_homepage.test.ts

  standalone-route-drafts-db-integration:
    name: Standalone Route Drafts DB Integration (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Standalone Route Drafts DB Tests
        run: |
          TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" BUILDER_ROUTE_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" npx vitest run --no-file-parallelism supabase/tests/builder_route_lifecycle.test.ts supabase/tests/builder_route_publication.test.ts

  standalone-navigation-db-integration:
    name: Standalone Navigation DB Integration (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Standalone Navigation DB Tests
        run: |
          BUILDER_ROUTE_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" npx vitest run supabase/tests/builder_site_navigation.test.ts supabase/tests/builder_navigation_publication.test.ts

  combined-db-integration:
    name: Combined Duplicate + Delete + Reorder + Homepage + Route + Navigation DB Integration (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Combined DB Regression Tests
        run: |
          PAGE_DUPLICATE_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" PAGE_DELETE_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" PAGE_REORDER_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" BUILDER_HOMEPAGE_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" BUILDER_ROUTE_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/postgres" npx vitest run --no-file-parallelism supabase/tests/duplicate_builder_page.test.ts supabase/tests/delete_builder_page.test.ts supabase/tests/reorder_builder_pages.test.ts supabase/tests/reorder_builder_pages_validation.test.ts supabase/tests/set_builder_homepage.test.ts supabase/tests/builder_route_lifecycle.test.ts supabase/tests/builder_route_publication.test.ts supabase/tests/builder_site_navigation.test.ts supabase/tests/builder_navigation_publication.test.ts
