name: PR65 Disposable Browser Gates
on:
  push:
    branches: [codex/pr65-browser-ci-20261024]
permissions:
  contents: read
jobs:
  disposable-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8d4cd3afd18e3ba241da5d2e4a402b4c0ec97f42
          path: target
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Assert exact composition and isolate harness
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = 8d4cd3afd18e3ba241da5d2e4a402b4c0ec97f42
          test "$(git rev-parse HEAD^{tree})" = a5050b0ee193642e668ac3b6f1ec4162130b90a9
          test "$(git show -s --format=%P HEAD)" = "86c2fca000dd15864eeea27faecdb4dafe915927 a2ce008a3d43f462b1b72a0b6506fa93fd440e0f"
          cp -R ../harness/.ci .ci
          node -e "const fs=require('fs');const p='supabase/config.toml';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/5432/g,'5642'))"
          npm run supabase:local:guard
      - name: Install locked dependencies and pinned Chromium
        working-directory: target
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Start disposable stack and replay migrations
        working-directory: target
        run: |
          npm run supabase:local:start > "$RUNNER_TEMP/local-start.log" 2>&1
          npm run supabase:local:reset > "$RUNNER_TEMP/local-reset.log" 2>&1
          echo 'Local start and migration replay PASS'
      - name: Local Auth RLS Storage regressions
        working-directory: target
        run: |
          npm run supabase:local:test > "$RUNNER_TEMP/local-tests.log" 2>&1
          npm run test:doc-1b2:live > "$RUNNER_TEMP/pdf-tests.log" 2>&1
          echo 'Local Auth RLS Storage and PDF lifecycle PASS'
      - name: SQL and separate-context browser gates
        working-directory: target
        run: node .ci/run.mjs
      - name: Stop disposable stack on every outcome
        if: always()
        working-directory: target
        run: |
          npm run supabase:local:stop > "$RUNNER_TEMP/local-stop.log" 2>&1
          echo 'Disposable stack stopped'
