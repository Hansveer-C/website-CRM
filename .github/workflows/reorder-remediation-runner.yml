name: Reorder Remediation Runner

on:
  push:
    branches:
      - codex/builder-phase-1-reorder-pages

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'chore(builder): run reorder remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/builder-phase-1-reorder-pages
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply reviewed remediation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1))

          migration = 'supabase/migrations/20260817050300_reorder_builder_pages.sql'
          replace_once(
              migration,
              '  v_unique_ordered_count integer;\n  v_is_noop boolean := true;',
              '  v_unique_ordered_count integer;\n  v_unique_expected_count integer;\n  v_is_noop boolean := true;'
          )
          replace_once(
              migration,
              '''  -- Check for null or empty elements in ordered IDs
  for i in 1..v_ordered_count loop
    if p_ordered_page_ids[i] is null or length(trim(p_ordered_page_ids[i])) = 0 then
      raise sqlstate 'PT400' using message = 'Invalid page ID in ordered list';
    end if;
  end loop;

  -- Check for duplicate IDs in ordered list
  select count(distinct id) into v_unique_ordered_count
  from unnest(p_ordered_page_ids) as id;

  if v_unique_ordered_count <> v_ordered_count then
    raise sqlstate 'PT400' using message = 'Duplicate page IDs in ordered list';
  end if;
''',
              '''  -- Validate every element in BOTH the desired order and the optimistic expected snapshot.
  for i in 1..v_ordered_count loop
    if p_ordered_page_ids[i] is null or length(trim(p_ordered_page_ids[i])) = 0 then
      raise sqlstate 'PT400' using message = 'Invalid page ID in ordered list';
    end if;
    if p_expected_page_ids[i] is null or length(trim(p_expected_page_ids[i])) = 0 then
      raise sqlstate 'PT400' using message = 'Invalid page ID in expected list';
    end if;
  end loop;

  -- Duplicate IDs are invalid in either complete-order array.
  select count(distinct id) into v_unique_ordered_count
  from unnest(p_ordered_page_ids) as id;

  if v_unique_ordered_count <> v_ordered_count then
    raise sqlstate 'PT400' using message = 'Duplicate page IDs in ordered list';
  end if;

  select count(distinct id) into v_unique_expected_count
  from unnest(p_expected_page_ids) as id;

  if v_unique_expected_count <> v_expected_count then
    raise sqlstate 'PT400' using message = 'Duplicate page IDs in expected list';
  end if;
'''
          )
          replace_once(
              migration,
              '    if v_current_page_ids[i] <> p_expected_page_ids[i] then',
              '    if v_current_page_ids[i] is distinct from p_expected_page_ids[i] then'
          )

          controller = 'src/builder_reorder_pages_controller.ts'
          replace_once(
              controller,
              "export type BuilderReorderStatus = 'idle' | 'reordering' | 'error' | 'success';",
              '''export interface BuilderReorderPagesLiveContextProviderOptions {
  getIdentityContext: () => { actingUserId?: string; website?: { id: string } | null };
  getPages: () => readonly Page[];
  getClient?: () => SupabaseClient | undefined;
  onPagesReordered?: (pages: Page[]) => void;
  onConflict?: () => void;
}

/**
 * Produces a context provider that resolves identity and Website scope on every call.
 * Pending operations therefore never rely on the controller-construction snapshot.
 */
export function createBuilderReorderPagesLiveContextProvider(
  options: BuilderReorderPagesLiveContextProviderOptions
): () => BuilderReorderPagesContext {
  return () => {
    const current = options.getIdentityContext();
    return {
      actingUserId: current.actingUserId,
      websiteId: current.website?.id,
      pages: options.getPages(),
      client: options.getClient?.(),
      onPagesReordered: options.onPagesReordered,
      onConflict: options.onConflict
    };
  };
}

export function mapBuilderReorderPagesBrowserFailure(
  code?: string,
  error?: string
): { status: number; code: string; error: string } {
  if (code === 'CONFLICT') {
    return { status: 409, code: 'CONFLICT', error: 'The page order changed elsewhere. Reload and try again.' };
  }
  if (code === 'NOT_FOUND') {
    return { status: 404, code: 'NOT_FOUND', error: 'Funnel not found' };
  }
  if (code === 'FORBIDDEN') {
    return { status: 403, code: 'FORBIDDEN', error: error || 'Forbidden' };
  }
  if (code === 'UNAUTHORIZED') {
    return { status: 401, code: 'UNAUTHORIZED', error: 'Unauthorized' };
  }
  if (code === 'INVALID_INPUT' || code === 'INVALID_PAYLOAD' || code === 'INVALID_PAGE_SET') {
    return { status: 400, code: 'INVALID_INPUT', error: error || 'Invalid page order payload' };
  }
  if (code === 'AMBIGUOUS') {
    return { status: 500, code: 'AMBIGUOUS', error: 'The reorder result is uncertain. Please reload to check.' };
  }
  return { status: 503, code: 'UNAVAILABLE', error: error || 'The page order could not be updated. Please try again.' };
}

export type BuilderReorderStatus = 'idle' | 'reordering' | 'error' | 'success';'''
          )

          main = 'src/main.ts'
          replace_once(
