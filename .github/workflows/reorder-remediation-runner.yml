              "import { BuilderReorderPagesController } from './builder_reorder_pages_controller';",
              "import { BuilderReorderPagesController, createBuilderReorderPagesLiveContextProvider, mapBuilderReorderPagesBrowserFailure } from './builder_reorder_pages_controller';"
          )
          replace_once(
              main,
