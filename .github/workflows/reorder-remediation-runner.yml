      - name: Install dependencies
        run: npm ci

      - name: Run focused lifecycle tests
        run: >-
          npx vitest run
          src/builder_page_lifecycle.test.ts
          src/builder_duplicate_page_controller.test.ts
          src/builder_delete_page_controller.test.ts
          src/builder_reorder_pages_controller.test.ts
          src/pages_repo_supabase.test.ts

      - name: Run Phase 0 tests
