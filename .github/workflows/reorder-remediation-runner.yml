      getIdentityContext: getBuilderNewPageContext,
      getPages: () => mockPages,
      getClient: () => (window as any).supabaseClient ?? undefined,
      onPagesReordered: (updatedPages) => {
        updatedPages.forEach(up => {
          const idx = mockPages.findIndex(p => p.id === up.id);
          if (idx >= 0) {
            mockPages[idx].step_order = up.step_order;
          }
        });
        renderBuilderPagesPanel();
      },
      onConflict: () => {
        renderBuilderPagesPanel();
      }
    })
  );
'''
          )

          controller_test = 'src/builder_reorder_pages_controller.test.ts'
          replace_once(
              controller_test,
              "import { BuilderReorderPagesController } from './builder_reorder_pages_controller';",
              "import { BuilderReorderPagesController, createBuilderReorderPagesLiveContextProvider, mapBuilderReorderPagesBrowserFailure } from './builder_reorder_pages_controller';"
          )
          p = Path(controller_test)
          text = p.read_text()
          if not text.endswith('});\n'):
              raise SystemExit('controller test: unexpected file ending')
          additions = r'''

  it('live context provider resolves user and Website identity freshly without controller reconstruction', () => {
    let actingUserId = 'u1';
    let websiteId = 'w1';
    const provider = createBuilderReorderPagesLiveContextProvider({
      getIdentityContext: () => ({ actingUserId, website: { id: websiteId } }),
      getPages: () => samplePages
    });

    expect(provider()).toMatchObject({ actingUserId: 'u1', websiteId: 'w1' });
    actingUserId = '';
    websiteId = 'w2';
    expect(provider()).toMatchObject({ actingUserId: '', websiteId: 'w2' });
  });

  it('stale async guard: logout while RPC is in flight suppresses protected state mutation', async () => {
    let actingUserId = 'u1';
    let reorderedInvoked = false;
    let resolveRpc: (val: any) => void;
    const rpcPromise = new Promise(resolve => { resolveRpc = resolve; });
    const reorderSpy = vi.spyOn(PagesRepo, 'reorderPages').mockImplementation(() => rpcPromise as any);
    const provider = createBuilderReorderPagesLiveContextProvider({
      getIdentityContext: () => ({ actingUserId, website: { id: 'w1' } }),
      getPages: () => samplePages,
      onPagesReordered: () => { reorderedInvoked = true; }
    });
    const controller = new BuilderReorderPagesController(provider);

    const pending = controller.movePageDown('p1');
    actingUserId = '';
    resolveRpc!({ success: true, data: { funnel_id: 'f1', pages: samplePages } });

    expect(await pending).toBe(false);
    expect(reorderedInvoked).toBe(false);
    reorderSpy.mockRestore();
  });

  it('same-Website active Page switch is not hijacked by reorder completion', async () => {
    let activePageId = 'p1';
    let reorderedInvoked = false;
    let resolveRpc: (val: any) => void;
    const rpcPromise = new Promise(resolve => { resolveRpc = resolve; });
    const reorderSpy = vi.spyOn(PagesRepo, 'reorderPages').mockImplementation(() => rpcPromise as any);
    const provider = createBuilderReorderPagesLiveContextProvider({
      getIdentityContext: () => ({ actingUserId: 'u1', website: { id: 'w1' } }),
      getPages: () => samplePages,
      onPagesReordered: () => { reorderedInvoked = true; }
    });
    const controller = new BuilderReorderPagesController(provider);

    const pending = controller.movePageDown('p1');
    activePageId = 'p3';
    resolveRpc!({ success: true, data: { funnel_id: 'f1', pages: samplePages } });

    expect(await pending).toBe(true);
    expect(reorderedInvoked).toBe(true);
    expect(activePageId).toBe('p3');
    reorderSpy.mockRestore();
  });

  it('older completion cannot overwrite a newer authoritative controller lifecycle', async () => {
    let websiteId = 'w1';
    let oldApplied = false;
    let newApplied = false;
    let resolveOld: (val: any) => void;
    const oldPromise = new Promise(resolve => { resolveOld = resolve; });
    let rpcCalls = 0;
    const reorderSpy = vi.spyOn(PagesRepo, 'reorderPages').mockImplementation(() => {
      rpcCalls += 1;
      if (rpcCalls == 1) return oldPromise as any;
      return Promise.resolve({ success: true, data: { funnel_id: 'f1', pages: samplePages } }) as any;
    });

    const oldController = new BuilderReorderPagesController(
      createBuilderReorderPagesLiveContextProvider({
        getIdentityContext: () => ({ actingUserId: 'u1', website: { id: websiteId } }),
        getPages: () => samplePages,
        onPagesReordered: () => { oldApplied = true; }
      })
    );
    const older = oldController.movePageDown('p1');

    websiteId = 'w2';
    const newController = new BuilderReorderPagesController(
      createBuilderReorderPagesLiveContextProvider({
        getIdentityContext: () => ({ actingUserId: 'u1', website: { id: websiteId } }),
        getPages: () => samplePages,
        onPagesReordered: () => { newApplied = true; }
      })
    );
    expect(await newController.movePageDown('p1')).toBe(true);
    expect(newApplied).toBe(true);

    resolveOld!({ success: true, data: { funnel_id: 'f1', pages: samplePages } });
    expect(await older).toBe(false);
    expect(oldApplied).toBe(false);
    expect(newApplied).toBe(true);
    reorderSpy.mockRestore();
  });

  it('browser failure mapping preserves AMBIGUOUS and deterministic domain codes', () => {
    expect(mapBuilderReorderPagesBrowserFailure('AMBIGUOUS')).toEqual({
      status: 500,
      code: 'AMBIGUOUS',
      error: 'The reorder result is uncertain. Please reload to check.'
    });
    expect(mapBuilderReorderPagesBrowserFailure('CONFLICT')).toMatchObject({ status: 409, code: 'CONFLICT' });
    expect(mapBuilderReorderPagesBrowserFailure('UNAUTHORIZED')).toMatchObject({ status: 401, code: 'UNAUTHORIZED' });
    expect(mapBuilderReorderPagesBrowserFailure('FORBIDDEN')).toMatchObject({ status: 403, code: 'FORBIDDEN' });
    expect(mapBuilderReorderPagesBrowserFailure('NOT_FOUND')).toMatchObject({ status: 404, code: 'NOT_FOUND' });
    expect(mapBuilderReorderPagesBrowserFailure('INVALID_PAGE_SET')).toMatchObject({ status: 400, code: 'INVALID_INPUT' });
  });
'''
