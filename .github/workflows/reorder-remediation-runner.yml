          git restore -- dist/index.html || true
          git diff --check
          git status --short

      - name: Commit and push remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reorder-remediation-runner.yml
          git add src/builder_reorder_pages_controller.ts src/builder_reorder_pages_controller.test.ts src/main.ts supabase/migrations/20260817050300_reorder_builder_pages.sql supabase/tests/reorder_builder_pages.test.ts
          git commit -m "fix(builder): harden reorder expected order and stale identity"
          git push origin HEAD:codex/builder-phase-1-reorder-pages
