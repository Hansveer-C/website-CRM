<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local recovery proof</title><link rel="stylesheet" href="/src/style.css"></head><body><div id="app"></div><script type="module">
// Synthetic-only browser fixture. No Supabase client, hosted requests or credentials.
import { createPasswordRecoveryRouter } from '/src/application_recovery_ui.ts';
window.calls = [];
const user = { id: 'synthetic-owner' };
const factory = async () => ({ auth: {
  resetPasswordForEmail: async () => { window.calls.push('request'); return {error:null}; },
  setSession: async credentials => { window.calls.push('exchange'); return credentials.access_token === 'expired' ? {data:{user:null},error:{}} : {data:{user},error:null}; },
  getUser: async () => ({data:{user},error:null}),
  updateUser: async () => { window.calls.push('update'); return {data:{user},error:null}; },
  signOut: async () => { window.calls.push('signout'); return {error:null}; }
}});
const handle = createPasswordRecoveryRouter(factory);
async function route() { if (!await handle(document.querySelector('#app'))) document.querySelector('#app').textContent = 'Normal sign-in route'; }
window.addEventListener('hashchange', route); route();
</script></body></html>
